---
# ansible/roles/shell/tasks/main.yml

- name: Check if Oh My Zsh is already installed
  stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: omz_installed

- name: Install Oh My Zsh
  shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  when: not omz_installed.stat.exists
  args:
    creates: "{{ ansible_env.HOME }}/.oh-my-zsh"

- name: Install zsh-autosuggestions plugin
  git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    depth: 1
    update: yes

- name: Install zsh-syntax-highlighting plugin
  git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    depth: 1
    update: yes

- name: Deploy .zshrc configuration
  template:
    src: zshrc.j2
    dest: "{{ ansible_env.HOME }}/.zshrc"
    backup: yes
    mode: '0644'

- name: Change default shell to zsh
  become: true
  user:
    name: "{{ ansible_env.USER }}"
    shell: /usr/bin/zsh
  register: shell_changed

- name: Display shell configuration info
  debug:
    msg:
      - "✅ Oh My Zsh installed with plugins"
      - "✅ Default shell changed to Zsh"
      - "💡 Run 'exec zsh' or restart terminal to start using Zsh"
  when: shell_changed.changed