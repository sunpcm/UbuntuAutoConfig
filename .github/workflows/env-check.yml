---
name: Validate

on:
  # quality 作业会扫描整个仓库（全部 *.sh、yamllint .），因此不做 push 路径过滤，
  # 否则 AcmeConfig/wsl-dev/ubuntu-server 等目录的 shell/yaml 问题会漏过 CI。
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install pinned quality tools
        run: |
          python -m pip install \
            ansible-core==2.18.6 \
            ansible-lint==25.1.3 \
            yamllint==1.35.1 \
            ruff==0.9.10
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          # go install 落在 GOPATH/bin，需加入后续步骤的 PATH，否则 actionlint/gitleaks 找不到。
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ShellCheck
        run: |
          mapfile -d '' scripts < <(find . -type f -name '*.sh' \
            -not -path './.git/*' -not -path './archive/*' -print0)
          shellcheck "${scripts[@]}"

      - name: Ansible Lint
        run: ansible-lint ansible

      - name: YAML Lint
        run: yamllint .

      - name: Ruff
        run: ruff check bin/devops-toolkit tests/test-wizard.py

      - name: Actionlint
        run: actionlint

      - name: Secrets scan
        run: gitleaks detect --source . --redact --no-banner

  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            ansible_core: "2.12.10"
          - python: "3.12"
            ansible_core: "2.18.6"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install validation dependencies
        run: |
          python -m pip install ansible-core==${{ matrix.ansible_core }}
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate
        run: ./tests/verify-ansible.sh
