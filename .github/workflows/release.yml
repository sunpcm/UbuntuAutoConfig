---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install ansible-core==2.18.6
          ansible-galaxy collection install \
            --requirements-file ansible/requirements.yml \
            --collections-path "${RUNNER_TEMP}/release-collections"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_TEMP}/release-collections" >>"${GITHUB_ENV}"
          echo "ANSIBLE_COLLECTIONS_PATHS=${RUNNER_TEMP}/release-collections" >>"${GITHUB_ENV}"

      - name: Validate source
        run: ./tests/verify-ansible.sh

      - name: Preserve validated collections for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-collections-${{ github.sha }}
          path: ${{ runner.temp }}/release-collections
          if-no-files-found: error
          retention-days: 1

  release:
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      COSIGN_VERSION: v3.1.1
      COSIGN_LINUX_AMD64_SHA256: ae1ecd212663f3693ad9edf8b1a183900c9a52d3155ba6e354237f9a0f6463fc
    steps:
      - name: Checkout validated tag on a fresh runner
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Confirm clean source
        run: test -z "$(git status --porcelain)"

      - name: Restore validated collections
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-collections-${{ github.sha }}
          path: ${{ runner.temp }}/release-collections

      - name: Build fixed-name assets
        env:
          DEVOPS_TOOLKIT_COLLECTIONS_SOURCE: ${{ runner.temp }}/release-collections
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist

      - name: Install pinned Cosign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/cosign"
          gh release download "${COSIGN_VERSION}" \
            --repo sigstore/cosign \
            --pattern cosign-linux-amd64 \
            --dir "${RUNNER_TEMP}/cosign"
          echo "${COSIGN_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/cosign/cosign-linux-amd64" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/cosign/cosign-linux-amd64"
          echo "${RUNNER_TEMP}/cosign" >>"${GITHUB_PATH}"
          mv "${RUNNER_TEMP}/cosign/cosign-linux-amd64" "${RUNNER_TEMP}/cosign/cosign"

      - name: Sign archive with GitHub OIDC
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/devops-toolkit.tar.gz.sigstore.json \
            dist/devops-toolkit.tar.gz

      - name: Verify Sigstore identity
        run: |
          cosign verify-blob \
            --bundle dist/devops-toolkit.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref "${GITHUB_REF}" \
            --certificate-github-workflow-trigger push \
            dist/devops-toolkit.tar.gz

      - name: Verify packaged version
        run: |
          mkdir packaged
          tar -xzf dist/devops-toolkit.tar.gz -C packaged
          test "$(cat packaged/devops-toolkit/VERSION)" = "${GITHUB_REF_NAME}"
          (cd dist && sha256sum --check devops-toolkit.tar.gz.sha256)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/devops-toolkit.tar.gz \
            dist/devops-toolkit.tar.gz.sha256 \
            dist/devops-toolkit.tar.gz.sigstore.json \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
